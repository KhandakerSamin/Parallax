# Ruff linter configuration for Python services
[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# UP017: keep timezone.utc so the code also runs on Python 3.10 locally.
ignore = ["E501", "UP017"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
